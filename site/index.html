<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <title>Vascolet</title>
  <link rel="stylesheet" href="style.css">
  <script src="launcher.js" defer></script>
</head>
<body>
  <main id="stage"><iframe id="emulator" title="Vascolet original" allow="autoplay; fullscreen; gamepad; cross-origin-isolated" hidden></iframe></main>
  <div id="boot" role="status"><div><p id="boot-text">Cargando…</p><progress id="progress" aria-label="Descarga del juego"></progress><button id="retry" hidden>Volver a intentar</button></div></div>
  <nav id="games" aria-label="Cambiar de Vascolet"></nav>
  <button id="menu-toggle" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">☰</button>
  <aside id="menu" aria-label="Opciones" hidden>
    <div class="menu-heading"><h1 id="title">Vascolet</h1><button id="close-menu" aria-label="Cerrar menú">×</button></div>
    <p id="runtime-status" class="muted" role="status">Preparando…</p>
    <label>Motor<select id="engine"><option value="auto">Automático</option><option value="xo" id="xo-option" hidden>XO · CheerpX (experimental)</option><option value="mt">JIT multihilo</option><option value="jit">JIT de un hilo · compatibilidad</option></select></label>
    <label class="check"><input id="sound" type="checkbox" checked> Sonido</label>
    <button id="restart">Aplicar y reiniciar</button>
    <button id="fullscreen">Pantalla completa</button>
    <hr>
    <h2>Partida</h2>
    <p class="muted">Se conservan los archivos que guarda el juego en este navegador. Usá también el guardado del propio juego. XO y Windows guardan sus partidas por separado.</p>
    <p id="save-status" class="muted" role="status">Guardado automático en IndexedDB.</p>
    <div class="row"><button id="export-save">Exportar</button><button id="import-save">Importar</button></div>
    <input id="save-file" type="file" accept="application/json,.json" hidden>
    <hr>
    <details id="diagnostics"><summary>Diagnóstico</summary><p id="metrics" class="muted"></p><pre id="log"></pre><button id="download-log">Descargar registro</button></details>
    <a id="repo" class="muted" href="https://github.com/frajusu">Repositorio ↗</a>
  </aside>
</body>
</html>
